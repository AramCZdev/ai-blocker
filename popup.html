<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width"> <!-- mobile-friendly -->
<base target="_blank"> <!-- Open links in new tab by default -->
</head>
<style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #6b7eff;
        --secondary: #d0d0d0;
        --accent: #00d9ff;
        --bg: #121212;
        --text: #f5f5f5;
        --border: #333333;
        --card-bg: #1e1e1e;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        padding: 20px;
    }
  
    .checkbox {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 25px;
        margin-bottom: 20px;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .checkbox h3 {
        font-size: 20px;
        color: var(--secondary);
    }

    .checkbox-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }


</style>
<body>
  <h2>AI Blocker</h2>
  This extension blocks AI Websites if you wish to unblock access to AI you can set this here.
  <p>


  <div class="checkbox">
        <div class="checkbox-header">
            <label>
              <input type="checkbox" id="checkbox_host_permission">
              Block access to AI
            </label>
        </div>
  </div>


  <p>If you have any questions contact me on my <a href="mailto:aramcz@protonmail.com">Email</a> or <a href="https://discord.gg/x8m4NjEaSs">Discord</a></p>
  <script src="popup.js"></script>
</body>
</html>
